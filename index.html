<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#060606" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atom Voice" />
    <title>Atom Voice</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <span class="brand">atom voice</span>
        <span class="status" id="status">offline</span>
      </div>

      <div class="stage">
        <h1 class="title">
          <span class="visually-hidden">Atom Voice</span>
          <svg class="vmark" viewBox="0 0 300 90" role="img" aria-hidden="true" focusable="false">
            <text x="150" y="66" text-anchor="middle" textLength="162" lengthAdjust="spacing"
                  font-family="'Anton', Impact, 'Arial Narrow', sans-serif" font-size="56"
                  fill="#FFFFFF">ATOM</text>
          </svg>
        </h1>
        <div class="orb-wrap">
          <!-- Sits behind the orb and drifts, so the orb reads as passing in
               front of it. Overflows the wrapper on purpose - the V is taller
               than the orb and should rise above it. -->
          <svg class="vfloat" viewBox="0 0 300 200" aria-hidden="true" focusable="false">
            <path d="M30 18 H92 L150 128 L208 18 H270 L182 176 H118 Z"
                  fill="none" stroke="#E50914" stroke-width="5" stroke-opacity="0.5"
                  stroke-linejoin="round"/>
          </svg>
          <span class="ring ring-1"></span>
          <span class="ring ring-2"></span>
          <span class="ring ring-3"></span>
          <button class="orb" id="orb" aria-label="Start call">
            <span class="orb-inner"></span>
          </button>
        </div>
        <p class="hint" id="hint">Tap to Talk</p>
        <p class="error-banner" id="errorBanner"></p>
      </div>

      <div class="controls" id="controls">
        <!--
        <button class="ctrl-btn" id="muteBtn">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
          <span>Mute</span>
        </button>
        -->
        <button class="end-btn" id="endBtn" aria-label="End call" title="End call">
          <!-- Curved handset: a thick arc hugging the top-left with flared
               ends, so it reads as a receiver rather than a bar. -->
          <svg class="icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path d="M33 11 Q11 11 11 33"
                  fill="none" stroke="#F9534F" stroke-width="11"
                  stroke-linecap="round"/>
            <circle cx="33" cy="11" r="7.5" fill="#F9534F"/>
            <circle cx="11" cy="33" r="7.5" fill="#F9534F"/>
          </svg>
        </button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
